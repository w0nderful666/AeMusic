name: Build APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debug APK
            task: assembleDebug
            artifact: AeMusic-v0.1.0-preview-debug-apk
            path: app/build/outputs/apk/debug/*.apk
          - label: R8 Internal APK
            task: assembleInternal
            artifact: AeMusic-v0.1.0-preview-r8-internal-apk
            path: app/build/outputs/apk/internal/*.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.label }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
